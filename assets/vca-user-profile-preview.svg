<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 960" width="100%" height="100%" style="background:#060a12; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="40%" stop-color="#0b1326"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="bannerGrad" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.7"/>
      <stop offset="35%" stop-color="#0f766e" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#1e3a8a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0a0f1d" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="cyanBtn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="960" fill="url(#bgGlow)"/>

  <!-- Subtle Matrix Grid -->
  <g stroke="#1e293b" stroke-width="0.5" opacity="0.25">
    <line x1="0" y1="120" x2="1000" y2="120"/>
    <line x1="0" y1="240" x2="1000" y2="240"/>
    <line x1="0" y1="360" x2="1000" y2="360"/>
    <line x1="0" y1="480" x2="1000" y2="480"/>
    <line x1="0" y1="600" x2="1000" y2="600"/>
    <line x1="0" y1="720" x2="1000" y2="720"/>
    <line x1="0" y1="840" x2="1000" y2="840"/>
    <line x1="200" y1="0" x2="200" y2="960"/>
    <line x1="400" y1="0" x2="400" y2="960"/>
    <line x1="600" y1="0" x2="600" y2="960"/>
    <line x1="800" y1="0" x2="800" y2="960"/>
  </g>

  <!-- Top Hero Banner / Artwork Background -->
  <rect x="0" y="0" width="1000" height="190" fill="url(#bannerGrad)"/>
  <circle cx="500" cy="90" r="140" fill="#10b981" opacity="0.15" filter="url(#subtleGlow)"/>
  <circle cx="580" cy="110" r="60" fill="#a7f3d0" opacity="0.25" filter="url(#subtleGlow)"/>

  <!-- Top Navigation Header Controls -->
  <g transform="translate(0, 16)">
    <!-- Scanner Button -->
    <g transform="translate(620, 0)">
      <rect width="170" height="36" rx="18" fill="#0284c7" filter="url(#dropShadow)"/>
      <text x="24" y="22" fill="#ffffff" font-size="11" font-weight="bold" letter-spacing="0.5">⚡ LIVE HUD SCANNER</text>
    </g>

    <!-- User Profile Badge Button -->
    <g transform="translate(805, 0)">
      <rect width="135" height="36" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <circle cx="18" cy="18" r="11" fill="#38bdf8"/>
      <text x="14" y="22" fill="#ffffff" font-size="10" font-weight="bold">TW</text>
      <text x="36" y="22" fill="#e2e8f0" font-size="11" font-weight="bold">Enterupted</text>
      <text x="112" y="21" fill="#94a3b8" font-size="11">↗</text>
    </g>

    <!-- Upload icon -->
    <g transform="translate(952, 0)">
      <rect width="36" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <path d="M 18,12 L 18,24 M 14,16 L 18,12 L 22,16 M 12,24 L 24,24" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- MAIN USER PROFILE CARD -->
  <!-- ================================================================= -->
  <g transform="translate(40, 130)" filter="url(#dropShadow)">
    <!-- Outer Card Shell -->
    <rect width="920" height="320" rx="18" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2"/>
    <rect width="920" height="320" rx="18" fill="none" stroke="#0ea5e9" stroke-width="0.8" opacity="0.3"/>

    <!-- Avatar Box with Neon Frame -->
    <g transform="translate(30, 45)">
      <rect width="120" height="120" rx="14" fill="#0284c7" opacity="0.2" filter="url(#subtleGlow)"/>
      <rect width="120" height="120" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8"/>
      <!-- Stylized Collector Portrait -->
      <circle cx="60" cy="50" r="26" fill="#38bdf8"/>
      <path d="M 28,105 C 28,78 42,72 60,72 C 78,72 92,78 92,105 Z" fill="#0284c7"/>
      <!-- VCA Authenticated Badge Pin -->
      <circle cx="106" cy="106" r="13" fill="#059669" stroke="#065f46" stroke-width="2"/>
      <text x="101" y="110" fill="#ffffff" font-size="11" font-weight="bold">✓</text>
    </g>

    <!-- Collector Title & Badges -->
    <g transform="translate(175, 45)">
      <text x="0" y="28" fill="#ffffff" font-size="26" font-weight="900" letter-spacing="0.5">Enterupted</text>

      <!-- VCA Verified Chip -->
      <rect x="145" y="10" width="115" height="22" rx="11" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1"/>
      <text x="156" y="25" fill="#38bdf8" font-size="10" font-weight="bold" letter-spacing="0.5">🛡️ VCA VERIFIED</text>

      <!-- Username Handle -->
      <text x="0" y="52" fill="#38bdf8" font-size="13" font-weight="bold">@toddwilliam420</text>

      <!-- Bio -->
      <text x="0" y="74" fill="#cbd5e1" font-size="12" font-weight="500">TCG Collector &amp; VCA Verified Curator.</text>
      <text x="0" y="92" fill="#cbd5e1" font-size="12" font-weight="500">Signature collection featuring VCA Gem Mint 10.0 Unbroken Bonds Reshiram &amp; Charizard GX.</text>

      <!-- Metadata location & date -->
      <g transform="translate(0, 114)">
        <text x="0" y="0" fill="#06b6d4" font-size="12">📍</text>
        <text x="16" y="0" fill="#94a3b8" font-size="11" font-weight="600">Seattle, WA</text>

        <text x="120" y="0" fill="#06b6d4" font-size="12">📅</text>
        <text x="136" y="0" fill="#94a3b8" font-size="11" font-weight="600">Joined August 2026</text>
      </g>
    </g>

    <!-- Metric Stat Boxes (Right Side) -->
    <g transform="translate(510, 45)">
      <!-- Portfolio Value -->
      <g transform="translate(0, 0)">
        <rect width="180" height="85" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
        <text x="16" y="24" fill="#64748b" font-size="9" font-weight="bold" letter-spacing="0.8">PORTFOLIO VALUE</text>
        <text x="16" y="60" fill="#10b981" font-size="24" font-weight="900" letter-spacing="0.5">$1,385.00</text>
      </g>

      <!-- VCA Graded -->
      <g transform="translate(195, 0)">
        <rect width="105" height="85" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
        <text x="14" y="24" fill="#64748b" font-size="9" font-weight="bold" letter-spacing="0.8">VCA GRADED</text>
        <text x="14" y="58" fill="#ffffff" font-size="22" font-weight="900">3</text>
        <text x="32" y="58" fill="#94a3b8" font-size="12" font-weight="bold">SLABS</text>
      </g>

      <!-- Vault Assets -->
      <g transform="translate(315, 0)">
        <rect width="80" height="85" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
        <text x="12" y="24" fill="#64748b" font-size="9" font-weight="bold" letter-spacing="0.8">ASSETS</text>
        <text x="12" y="58" fill="#ffffff" font-size="22" font-weight="900">3</text>
      </g>
    </g>

    <!-- Navigation Tab Pills Bar -->
    <g transform="translate(30, 245)">
      <!-- Tab 1: Vault & Portfolio -->
      <g transform="translate(0, 0)">
        <rect width="175" height="38" rx="8" fill="#090d16" stroke="#334155" stroke-width="0.8"/>
        <text x="16" y="23" fill="#cbd5e1" font-size="11" font-weight="bold">🛡️ VAULT &amp; PORTFOLIO (3)</text>
      </g>

      <!-- Tab 2: Live HUD Scanner -->
      <g transform="translate(185, 0)">
        <rect width="155" height="38" rx="8" fill="#090d16" stroke="#0ea5e9" stroke-width="0.8"/>
        <text x="16" y="23" fill="#38bdf8" font-size="11" font-weight="bold">⚡ LIVE HUD SCANNER</text>
      </g>

      <!-- Tab 3: 3D Slab Inspection -->
      <g transform="translate(350, 0)">
        <rect width="165" height="38" rx="8" fill="#090d16" stroke="#334155" stroke-width="0.8"/>
        <text x="16" y="23" fill="#cbd5e1" font-size="11" font-weight="bold">⬡ 3D SLAB INSPECT</text>
      </g>

      <!-- Tab 4: Single Photo Scanner -->
      <g transform="translate(525, 0)">
        <rect width="170" height="38" rx="8" fill="#090d16" stroke="#334155" stroke-width="0.8"/>
        <text x="16" y="23" fill="#cbd5e1" font-size="11" font-weight="bold">📷 PHOTO SCANNER</text>
      </g>

      <!-- Tab 5: Active NFC Slab Ledger Pill (Highlighted) -->
      <g transform="translate(705, 0)">
        <rect width="185" height="38" rx="8" fill="url(#cyanBtn)" filter="url(#dropShadow)"/>
        <text x="18" y="23" fill="#ffffff" font-size="11" font-weight="bold" letter-spacing="0.5">📶 NFC SLAB LEDGER</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- NFC SLAB VERIFICATION & OWNERSHIP LEDGER PANEL -->
  <!-- ================================================================= -->
  <g transform="translate(40, 480)" filter="url(#dropShadow)">
    <rect width="920" height="440" rx="18" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2"/>
    <rect width="920" height="440" rx="18" fill="none" stroke="#06b6d4" stroke-width="0.8" opacity="0.4"/>

    <!-- Section Title & Subtitle -->
    <g transform="translate(35, 35)">
      <text x="0" y="0" fill="#38bdf8" font-size="18" font-weight="bold" letter-spacing="0.5">📶 NFC SLAB VERIFICATION &amp; OWNERSHIP LEDGER</text>
      <text x="0" y="24" fill="#94a3b8" font-size="12">Every VCA physical slab is embedded with an NXP NTAG424 DNA cryptographic NFC chip.</text>
    </g>

    <!-- Tap Input & Simulation Box -->
    <g transform="translate(35, 85)">
      <rect width="850" height="110" rx="12" fill="#070c18" stroke="#1e293b" stroke-width="1"/>
      <text x="24" y="28" fill="#64748b" font-size="10" font-weight="bold" letter-spacing="0.8">SIMULATE OR READ PHYSICAL NFC TAP</text>

      <!-- Input Field Display -->
      <g transform="translate(24, 42)">
        <rect width="640" height="42" rx="6" fill="#0b1329" stroke="#334155" stroke-width="1"/>
        <text x="16" y="26" fill="#38bdf8" font-size="13" font-family="monospace" font-weight="bold">1D:93:48:A9:1C:10:80</text>
      </g>

      <!-- Resolve Slab Button -->
      <g transform="translate(680, 42)">
        <rect width="145" height="42" rx="6" fill="url(#cyanBtn)" filter="url(#dropShadow)"/>
        <text x="18" y="26" fill="#ffffff" font-size="11" font-weight="bold" letter-spacing="0.5">📶 RESOLVE SLAB</text>
      </g>

      <!-- Quick Test UID link -->
      <text x="24" y="100" fill="#64748b" font-size="10">Quick Test UID: </text>
      <text x="105" y="100" fill="#38bdf8" font-size="10" font-family="monospace" text-decoration="underline">1D:93:48:A9:1C:10:80 (Reshiram &amp; Charizard GX)</text>
    </g>

    <!-- Cryptographically Verified Record Card -->
    <g transform="translate(35, 215)">
      <rect width="850" height="190" rx="12" fill="#080e1d" stroke="#10b981" stroke-width="1.2"/>

      <!-- Card Top Badges -->
      <g transform="translate(24, 25)">
        <text x="0" y="0" fill="#10b981" font-size="12" font-weight="bold" letter-spacing="0.5">🛡️ CRYPTOGRAPHICALLY_VERIFIED</text>
      </g>
      <g transform="translate(710, 12)">
        <rect width="115" height="24" rx="12" fill="#0369a1" fill-opacity="0.3" stroke="#0ea5e9" stroke-width="1"/>
        <text x="12" y="16" fill="#38bdf8" font-size="10" font-family="monospace" font-weight="bold">VCA-2026-0001</text>
      </g>

      <!-- Card Thumbnail Mock -->
      <g transform="translate(24, 45)">
        <!-- Slab Frame Outer -->
        <rect width="90" height="125" rx="6" fill="#0f172a" stroke="#d97706" stroke-width="1.5" filter="url(#dropShadow)"/>
        <!-- Slab Header Pill -->
        <rect x="6" y="6" width="78" height="16" rx="3" fill="#1e293b"/>
        <text x="12" y="17" fill="#fbbf24" font-size="8" font-weight="bold">GEM MINT 10</text>
        <!-- Card Artwork Representation -->
        <rect x="8" y="26" width="74" height="92" rx="3" fill="#1e3a8a"/>
        <circle cx="45" cy="65" r="22" fill="#60a5fa" opacity="0.6"/>
        <circle cx="45" cy="65" r="12" fill="#ffffff" opacity="0.8" filter="url(#subtleGlow)"/>
      </g>

      <!-- Card Verification Metadata Details -->
      <g transform="translate(135, 60)">
        <text x="0" y="18" fill="#ffffff" font-size="20" font-weight="bold">Arceus</text>
        <text x="0" y="42" fill="#94a3b8" font-size="11" font-family="monospace">Platinum: Arceus · AR5 · Colorless Holofoil (Ripple Swell / Sky Spear)</text>
        
        <!-- Grade Score -->
        <text x="0" y="72" fill="#10b981" font-size="13" font-weight="bold" letter-spacing="0.5">OVERALL GRADE: GEM MINT 10.0</text>

        <!-- Ownership -->
        <text x="0" y="98" fill="#64748b" font-size="11">Current Owner: </text>
        <text x="95" y="98" fill="#f1f5f9" font-size="12" font-weight="bold">Todd William</text>

        <!-- Subgrades summary mini pills -->
        <g transform="translate(240, 85)">
          <rect width="70" height="18" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
          <text x="8" y="13" fill="#38bdf8" font-size="9">Centering: 10</text>
          
          <rect x="80" width="70" height="18" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
          <text x="88" y="13" fill="#38bdf8" font-size="9">Corners: 9.5</text>

          <rect x="160" width="70" height="18" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
          <text x="168" y="13" fill="#38bdf8" font-size="9">Edges: 10</text>

          <rect x="240" width="70" height="18" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
          <text x="248" y="13" fill="#38bdf8" font-size="9">Surface: 10</text>
        </g>
      </g>
    </g>
  </g>
</svg>
